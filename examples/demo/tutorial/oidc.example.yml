name: Deploy the app with short-lived credentials
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v7
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ericclemmons/effect-ci-testbed
          ref: 8e7e3a13fa25f1846ecd9a356376e3f88632601a
          path: effect-ci
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml
      - run: pnpm --dir ../effect-ci install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: echo "$GITHUB_WORKSPACE/effect-ci/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm exec vp run build
      - run: effect-ci oidc -- pnpm exec wrangler deploy
