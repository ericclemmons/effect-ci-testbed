name: Effect CI

on:
  workflow_call:
    inputs:
      workflow:
        description: Path to the Effect CI entry point
        required: true
        type: string
      runs-on:
        description: JSON array of labels selecting the GitHub runner
        required: false
        type: string
        default: '["ubuntu-latest"]'
      event:
        description: Optional portable workflow event override
        required: false
        type: string
        default: ""
    secrets:
      EFFECT_CI_APP_PRIVATE_KEY:
        description: Private key for the Effect CI GitHub App
        required: true

permissions:
  contents: read

jobs:
  run:
    name: ${{ matrix.mode }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    strategy:
      fail-fast: false
      matrix:
        mode: [plan, execute]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Resolve Effect CI cache policy
        id: effect-ci-cache
        env:
          EFFECT_CI_WORKFLOW: ${{ inputs.workflow }}
        run: node packages/ci/cache.run.ts
      - uses: actions/cache@v5
        if: matrix.mode == 'execute' && steps.effect-ci-cache.outputs.enabled == 'true'
        with:
          path: ${{ steps.effect-ci-cache.outputs.paths }}
          key: ${{ steps.effect-ci-cache.outputs.key }}-${{ runner.os }}-${{ steps.effect-ci-cache.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.effect-ci-cache.outputs.key }}-${{ runner.os }}-${{ steps.effect-ci-cache.outputs.fingerprint }}-
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.EFFECT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.EFFECT_CI_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Run ${{ inputs.workflow }} (${{ matrix.mode }})
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          EFFECT_CI_EVENT: ${{ inputs.event || github.event_name }}
          EFFECT_CI_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          EFFECT_CI_WORKFLOW: ${{ inputs.workflow }}
          DRY_RUN: ${{ matrix.mode == 'plan' && '1' || '' }}
          EFFECT_CI_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EFFECT_CI_EXTERNAL_ID: github-actions:${{ github.run_id }}:${{ github.run_attempt }}:${{ inputs.workflow }}:${{ matrix.mode }}
        run: node packages/github/run.run.ts
