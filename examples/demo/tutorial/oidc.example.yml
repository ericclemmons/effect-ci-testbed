name: Deploy the app with short-lived credentials
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: ericclemmons/effect-ci-testbed/.github/actions/cloudflare-auth@95e9d2c4027b2d2fb8d88af1545442bef0677c4d
        with:
          enroll: "true"
          worker: walkthrough
      - run: pnpm exec cf deploy
