name: GitHub Actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 24
          cache: true
          run-install: true
      - run: npm run lint
      - run: npm run check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
