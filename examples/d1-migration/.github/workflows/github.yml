name: GitHub Actions

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npx cf build --mode production
      - id: migrate
        continue-on-error: true
        run: npx cf d1 migrations apply 11111111-1111-4111-8111-111111111111 --dir migrations --local --persist-to .effect-ci-state --quiet
      - id: deploy
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        run: npx cf deploy --prebuilt --mode production --dry-run
      - name: Roll back migration
        if: steps.migrate.outcome == 'failure' || steps.deploy.outcome == 'failure'
        run: npx cf d1 raw 11111111-1111-4111-8111-111111111111 --sql "DROP TABLE IF EXISTS users; DELETE FROM d1_migrations WHERE name = '0001_create_users.sql'" --local --persist-to .effect-ci-state --quiet
      - name: Preserve the original failure
        if: steps.migrate.outcome == 'failure' || steps.deploy.outcome == 'failure'
        run: exit 1
