name: examples/node-npm/.github/workflows/github.yml

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # GitHub only loads workflows from the repository root. Stage the fixture so
      # these steps exercise it exactly as a standalone repository would.
      - name: Stage standalone example
        run: |
          mkdir -p .e2e/node-npm
          cp -R examples/node-npm/. .e2e/node-npm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        working-directory: .e2e/node-npm
      - run: npm run lint
        working-directory: .e2e/node-npm
      - run: npm test
        working-directory: .e2e/node-npm
      - run: npm run build
        working-directory: .e2e/node-npm
