name: GitHub Actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - parallel:
          - run: npm run lint
          - run: npm run format
            continue-on-error: true
      - run: npm test
      - run: npm run build
      - run: echo pnpx cf deploy
