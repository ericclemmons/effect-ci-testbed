name: examples / e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  example:
    name: ${{ matrix.example }} / ${{ matrix.implementation }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - node-npm
        implementation:
          - github-actions
          - effect-on-github
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - if: matrix.implementation == 'effect-on-github'
        uses: pnpm/action-setup@v4
      - name: Run end-to-end flow
        env:
          EXAMPLE: ${{ matrix.example }}
          IMPLEMENTATION: ${{ matrix.implementation }}
        run: bash "examples/$EXAMPLE/.e2e/$IMPLEMENTATION.sh"
