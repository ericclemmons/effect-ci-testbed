name: GitHub Actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: printf prepared > prepared.txt
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: prepared
          path: app/prepared.txt

  check:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [left, right]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: prepared
          path: app
      - name: Isolated ${{ matrix.name }} check
        working-directory: app
        run: |
          test "$(cat prepared.txt)" = prepared
          printf '${{ matrix.name }}' > branch.txt
          sleep 2
          test "$(cat branch.txt)" = '${{ matrix.name }}'
