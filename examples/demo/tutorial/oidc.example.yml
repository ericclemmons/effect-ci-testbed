name: Deploy the app with short-lived credentials
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm build
      # effect-ci must be installed alongside the project's CI dependencies.
      - run: effect-ci oidc
        env:
          EFFECT_CI_REMOTE_URL: ${{ vars.EFFECT_CI_REMOTE_URL }}
      - run: effect-ci oidc -- wrangler deploy
