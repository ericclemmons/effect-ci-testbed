name: Effect CI
on:
  push:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v7
        with:
          path: project
          persist-credentials: false
      # The prototype CLI is unpublished. Install it outside the app checkout.
      - uses: actions/checkout@v7
        with:
          repository: ericclemmons/effect-ci-testbed
          ref: main
          path: effect-ci
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: effect-ci/pnpm-lock.yaml
      - run: pnpm --dir ../effect-ci install --frozen-lockfile
      - run: echo "$GITHUB_WORKSPACE/effect-ci/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build on the enrolled host
        run: effect-ci run
