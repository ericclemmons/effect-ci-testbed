name: Cloudflare runner smoke

# Copy into the enrolled private repository only after the runner is enabled.
# A normal push is the admission event; this is not a manual dispatch endpoint.
on:
  push:
    branches:
      - runner-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: effect-ci-cloudflare
    timeout-minutes: 5
    steps:
      - name: Verify Linux and unprivileged job execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" = 1001
          printf 'Fresh Cloudflare runner: Linux x86_64, uid 1001\n'
      - name: Verify independent native step output
        shell: bash
        run: |
          set -euo pipefail
          printf 'GitHub owns this step and its stdout\n'
          printf 'GitHub also captures stderr\n' >&2
