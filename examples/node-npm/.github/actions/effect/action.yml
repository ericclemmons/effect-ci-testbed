name: node-npm Effect CI
description: Plan and execute the Effect-authored Node/npm workflow

inputs:
  environment:
    description: Value exposed to the workflow as NODE_ENV
    required: false
    default: development

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install testbed
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Plan
      shell: bash
      env:
        DRY_RUN: "1"
        NODE_ENV: ${{ inputs.environment }}
      run: pnpm ci:node-npm

    - name: Execute
      shell: bash
      env:
        NODE_ENV: ${{ inputs.environment }}
      run: pnpm ci:node-npm
