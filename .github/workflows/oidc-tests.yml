name: OIDC broker prototype
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test .github/actions/cloudflare-auth/client.test.mjs
      - run: pnpm --dir apps/oidc-broker test
      - run: pnpm --dir apps/oidc-broker check
      - run: pnpm --dir apps/oidc-broker build
      - run: pnpm --dir examples/oidc-wrangler check
      - run: pnpm --dir examples/oidc-wrangler build
      - run: pnpm --dir examples/oidc-cf check
      - run: pnpm --dir examples/oidc-cf build
