name: GitHub Actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- node -e "if (process.version !== 'v22.20.0') process.exit(1)"
      - run: mise exec -- python -c "import platform; assert platform.python_version() == '3.13.7'"
