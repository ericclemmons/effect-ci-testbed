name: OIDC live deployment proof
on:
  workflow_dispatch:
    inputs:
      example:
        description: Deployment CLI to try
        type: choice
        options: [both, wrangler, cf]
        default: both
  push:
    branches: [codex/oidc-runner-integration]
    paths-ignore: ["**/*.md", "apps/github-actions-runner/verification/**"]
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(inputs.example == 'cf' && '["cf"]' || inputs.example == 'wrangler' && '["wrangler"]' || '["wrangler","cf"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cf-ci oidc
        env:
          EFFECT_CI_REMOTE_URL: ${{ vars.EFFECT_CI_REMOTE_URL }}
      - run: pnpm exec cf-ci oidc -- pnpm --dir examples/oidc-${{ matrix.tool }} run deploy
      - run: node examples/oidc-${{ matrix.tool }}/verify.mjs
        env:
          EFFECT_CI_REMOTE_URL: ${{ vars.EFFECT_CI_REMOTE_URL }}
