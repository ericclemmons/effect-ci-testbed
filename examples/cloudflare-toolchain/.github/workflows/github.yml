name: GitHub Actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends python3 python3-venv
          else
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends python3 python3-venv
          fi
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install --no-cache-dir build==1.3.0 hatchling==1.27.0
      - run: ../.venv/bin/python -m build --no-isolation
        working-directory: app
