name: Testbed E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  github:
    name: ${{ matrix.example }} / github
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - node-npm
          - zero-config
          - developer-loop
          - exported-actions
          - node-pnpm
          - optional-checks
          - local-container
          - mise-toolchain
          - node-version
          - system-package
          - cache-policy
          - snapshot-fanout
          - cloudflare-runner
          - cloudflare-toolchain
          - dynamic-worker-checks
          - vite-plus-cache
          - turborepo-cache
          - package-manager-cache
          - runner-selection
          - ordered-deploy
          - custom-container-image
          - execution-policy
          - conditional-deploy
          - portable-artifacts
          - secure-secrets
          - rollback-compensation
          - deploy-hook
    steps:
      - uses: actions/checkout@v7

      - name: Install act
        env:
          ACT_VERSION: v0.2.89
          ACT_SHA256: 0191d6f1f3b716b5c55820032605d05fc3c1cdbf581ebeff655019e5dd1524c0
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/nektos/act/releases/download/${ACT_VERSION}/act_Linux_x86_64.tar.gz" \
            --output "$RUNNER_TEMP/act.tar.gz"
          echo "$ACT_SHA256  $RUNNER_TEMP/act.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/act"
          tar -xzf "$RUNNER_TEMP/act.tar.gz" -C "$RUNNER_TEMP/act" act
          echo "$RUNNER_TEMP/act" >> "$GITHUB_PATH"

      - name: Run examples/${{ matrix.example }}/.github/workflows/github.yml
        env:
          EXAMPLE: ${{ matrix.example }}
          ACT_EVENT: ${{ matrix.example == 'deploy-hook' && 'workflow_dispatch' || 'pull_request' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          example_root="$RUNNER_TEMP/examples/$EXAMPLE"
          mkdir -p "$example_root"
          cp -R "examples/$EXAMPLE/." "$example_root"

          git -C "$example_root" init --initial-branch=main
          git -C "$example_root" config user.name effect-ci-testbed
          git -C "$example_root" config user.email effect-ci-testbed@users.noreply.github.com
          git -C "$example_root" add .
          git -C "$example_root" commit -m "Stage $EXAMPLE"

          cd "$example_root"
          act "$ACT_EVENT" \
            --bind \
            --concurrent-jobs 1 \
            --platform ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-latest \
            --secret GITHUB_TOKEN \
            --workflows .github/workflows/github.yml

  local:
    name: ${{ matrix.example }} / local / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - node-npm
          - zero-config
          - developer-loop
          - exported-actions
          - node-pnpm
          - optional-checks
          - runner-selection
          - local-container
          - mise-toolchain
          - node-version
          - system-package
          - cache-policy
          - artifacts-source
          - dynamic-worker-checks
          - ordered-deploy
          - custom-container-image
          - deploy-hook
        mode:
          - plan
          - execute
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Run examples/${{ matrix.example }} (${{ matrix.mode }})
        env:
          EFFECT_CI_EVENT: ${{ matrix.example == 'deploy-hook' && 'deploy_hook' || 'pull_request' }}
        run: |
          workflow="examples/${{ matrix.example }}/.cloudflare/ci/workflow.ts"
          if [ "${{ matrix.example }}" = "zero-config" ] || [ "${{ matrix.example }}" = "developer-loop" ]; then
            workflow="examples/${{ matrix.example }}/.cloudflare/ci/ci.ts"
          fi
          pnpm cf-ci --workflow "$workflow" ${{ matrix.mode == 'execute' && 'run' || 'plan' }} --format=text

  agent-cli:
    name: agent-first executable CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Discover explicitly exported actions
        run: pnpm cf-ci --workflow examples/exported-actions/.cloudflare/ci/workflow.ts list --format=text
      - name: Plan one action as structured output
        run: |
          output=$(pnpm --silent cf-ci --workflow examples/exported-actions/.cloudflare/ci/workflow.ts plan check --format=json)
          echo "$output"
          OUTPUT="$output" node -e '
            const value = JSON.parse(process.env.OUTPUT)
            if (!value.ok || value.target !== "check") process.exit(1)
            if (value.plan.nodes.at(-1)?.id !== "check") process.exit(1)
          '
      - name: Reject an internal action
        run: |
          output="$RUNNER_TEMP/effect-ci-internal.json"
          if pnpm --silent cf-ci --workflow examples/exported-actions/.cloudflare/ci/workflow.ts run checkout --format=json >"$output"; then
            echo "Expected an unexported action to be rejected" >&2
            exit 1
          else
            status=$?
          fi
          cat "$output"
          test "$status" -eq 2
          grep --fixed-strings '"code": "CI_UNKNOWN_TARGET"' "$output"
      - name: Return a stable remote-provider exit
        run: |
          output="$RUNNER_TEMP/effect-ci-remote.json"
          if pnpm --silent cf-ci --workflow examples/exported-actions/.cloudflare/ci/workflow.ts --remote --format=json >"$output"; then
            echo "Expected unconfigured remote execution to fail" >&2
            exit 1
          else
            status=$?
          fi
          cat "$output"
          test "$status" -eq 3
          grep --fixed-strings '"code": "CI_REMOTE_UNAVAILABLE"' "$output"

  dependency-aware-reruns:
    name: dependency-aware rerun selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: node --test examples/dependency-aware-reruns/.cloudflare/ci/tests/dependency-aware-reruns.test.ts

  d1-migration-contract:
    name: d1-migration / plan and Worker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm cf-ci --workflow examples/d1-migration/.cloudflare/ci/workflow.ts plan
      - run: pnpm --dir examples/d1-migration exec cf build --mode production

  immutable-attempts:
    name: immutable attempts and checkpoint reuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: node --test examples/immutable-attempts/.cloudflare/ci/tests/immutable-attempts.test.ts

  sdk-semantics:
    name: ${{ matrix.example }} / tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - execution-policy
          - conditional-deploy
          - rollback-compensation
          - secure-secrets
          - portable-artifacts
          - verification-evidence
          - source-providers
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: node --test examples/${{ matrix.example }}/.cloudflare/ci/tests/${{ matrix.example }}.test.ts

  automatic-data-tracking:
    name: vite-plus-cache / automatic data tracking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: node --test examples/vite-plus-cache/.cloudflare/ci/tests/automatic-data-tracking.test.ts

  signed-evidence:
    name: verification-evidence / signed Git note reuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Record locally and verify with a public-only CI runner
        env:
          EFFECT_CI_EVENT: push
          EFFECT_CI_REVISION: ${{ github.sha }}
        run: |
          git config user.name "Effect CI"
          git config user.email "effect-ci@users.noreply.github.com"
          node --input-type=module -e '
            import { generateKeyPairSync } from "node:crypto"
            import { writeFileSync } from "node:fs"
            const pair = generateKeyPairSync("ed25519", {
              privateKeyEncoding: { format: "pem", type: "pkcs8" },
              publicKeyEncoding: { format: "pem", type: "spki" },
            })
            writeFileSync(process.env.RUNNER_TEMP + "/effect-ci-private.pem", pair.privateKey)
            writeFileSync(process.env.RUNNER_TEMP + "/effect-ci-public.pem", pair.publicKey)
          '
          export EFFECT_CI_CHECK_PRIVATE_KEY="$(cat "$RUNNER_TEMP/effect-ci-private.pem")"
          export EFFECT_CI_CHECK_PUBLIC_KEY="$(cat "$RUNNER_TEMP/effect-ci-public.pem")"
          pnpm cf-ci --workflow examples/verification-evidence/.cloudflare/ci/workflow.ts run --format=json

          unset EFFECT_CI_CHECK_PRIVATE_KEY
          output=$(pnpm --silent cf-ci --workflow examples/verification-evidence/.cloudflare/ci/workflow.ts run --format=json)
          echo "$output"
          OUTPUT="$output" node -e '
            const value = JSON.parse(process.env.OUTPUT)
            const lint = value.plan.nodes.find((node) => node.id === "verified lint")
            if (lint?.status !== "verified") process.exit(1)
          '

  effect-on-github:
    name: ${{ matrix.example }} / effect-on-github
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: node-npm
            workflow: examples/node-npm/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: zero-config
            workflow: examples/zero-config/.cloudflare/ci/ci.ts
            runs-on: '["ubuntu-latest"]'
          - example: developer-loop
            workflow: examples/developer-loop/.cloudflare/ci/ci.ts
            runs-on: '["ubuntu-latest"]'
            cache-key: developer-loop-vite-task
            cache-key-files: examples/developer-loop/package-lock.json
            cache-path: |
              node_modules/.vite/task-cache
              examples/developer-loop/node_modules/.vite/task-cache
          - example: deploy-hook
            workflow: examples/deploy-hook/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
            event: deploy_hook
          - example: exported-actions
            workflow: examples/exported-actions/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: node-pnpm
            workflow: examples/node-pnpm/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: optional-checks
            workflow: examples/optional-checks/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: local-container
            workflow: examples/local-container/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: execution-policy
            workflow: examples/execution-policy/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: conditional-deploy
            workflow: examples/conditional-deploy/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: rollback-compensation
            workflow: examples/rollback-compensation/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: secure-secrets
            workflow: examples/secure-secrets/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: portable-artifacts
            workflow: examples/portable-artifacts/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: verification-evidence
            workflow: examples/verification-evidence/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: mise-toolchain
            workflow: examples/mise-toolchain/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: node-version
            workflow: examples/node-version/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
            cache-key: node-version
            cache-key-files: examples/node-version/.node-version
            cache-path: examples/node-version/.effect-ci/cache/mise
          - example: system-package
            workflow: examples/system-package/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: cache-policy
            workflow: examples/cache-policy/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
            cache-key: custom-build-cache
            cache-key-files: examples/cache-policy/app/src/input.txt
            cache-path: examples/cache-policy/app/.cache/build
          - example: r2-source
            workflow: examples/r2-source/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: cloudflare-runner
            workflow: examples/cloudflare-runner/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: artifacts-source
            workflow: examples/artifacts-source/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: cloudflare-toolchain
            workflow: examples/cloudflare-toolchain/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: dynamic-worker-checks
            workflow: examples/dynamic-worker-checks/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: vite-plus-cache
            workflow: examples/vite-plus-cache/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
            cache-key: vite-task
            cache-key-files: examples/vite-plus-cache/app/package-lock.json
            cache-path: |
              node_modules/.vite/task-cache
              examples/vite-plus-cache/app/node_modules/.vite/task-cache
          - example: turborepo-cache
            workflow: examples/turborepo-cache/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
            cache-key: turbo-task
            cache-key-files: examples/turborepo-cache/app/package-lock.json
            cache-path: examples/turborepo-cache/app/.turbo/cache
          - example: package-manager-cache
            workflow: examples/package-manager-cache/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
            cache-key: npm-downloads
            cache-key-files: examples/package-manager-cache/app/package-lock.json
            cache-path: examples/package-manager-cache/app/.effect-ci/cache/npm
          - example: runner-selection
            workflow: examples/runner-selection/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: ordered-deploy
            workflow: examples/ordered-deploy/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
          - example: custom-container-image
            workflow: examples/custom-container-image/.cloudflare/ci/workflow.ts
            runs-on: '["ubuntu-latest"]'
    uses: ./.github/workflows/effect-ci.yml
    with:
      workflow: ${{ matrix.workflow }}
      runs-on: ${{ matrix.runs-on }}
      event: ${{ matrix.event || '' }}
      cache-key: ${{ matrix.cache-key || '' }}
      cache-key-files: ${{ matrix.cache-key-files || '' }}
      cache-path: ${{ matrix.cache-path || '' }}
    secrets: inherit

  hitl-deploy:
    name: hitl-deploy / local / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - plan
          - approved
          - rejected
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Verify ${{ matrix.mode }} deployment decision
        env:
          EFFECT_CI_APPROVAL: ${{ matrix.mode == 'rejected' && 'rejected' || 'approved' }}
          EFFECT_CI_EVENT: workflow_dispatch
        run: |
          output="$RUNNER_TEMP/hitl-deploy-${{ matrix.mode }}.log"

          if [ "${{ matrix.mode }}" = "rejected" ]; then
            if pnpm cf-ci --workflow examples/hitl-deploy/.cloudflare/ci/workflow.ts >"$output" 2>&1; then
              cat "$output"
              echo "Expected the rejected approval to fail" >&2
              exit 1
            fi

            cat "$output"
            grep --fixed-strings "CI_APPROVAL_REJECTED" "$output"

            if grep --fixed-strings '$ echo npx cf deploy' "$output"; then
              echo "Deploy command ran after rejection" >&2
              exit 1
            fi
          else
            pnpm cf-ci --workflow examples/hitl-deploy/.cloudflare/ci/workflow.ts ${{ matrix.mode == 'plan' && 'plan' || 'run' }}
          fi

  cloudflare-runner:
    name: ${{ matrix.example }} / Cloudflare local runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: cloudflare-runner
            package: effect-ci-cloudflare-runner-fixture
            workflow: effect-ci-cloudflare-runner
          - example: cloudflare-toolchain
            package: effect-ci-cloudflare-toolchain-fixture
            workflow: effect-ci-cloudflare-toolchain
          - example: custom-runner-image
            package: effect-ci-custom-runner-image-fixture
            workflow: effect-ci-custom-runner-image
          - example: snapshot-fanout
            package: effect-ci-snapshot-fanout-fixture
            workflow: effect-ci-snapshot-fanout
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Verify portable plan and Worker bundle
        env:
          EFFECT_CI_EVENT: workflow_dispatch
        run: |
          pnpm cf-ci --workflow examples/${{ matrix.example }}/.cloudflare/ci/workflow.ts plan
          pnpm --filter ${{ matrix.package }} exec wrangler deploy \
            --dry-run \
            --containers-rollout=none
      - name: Execute the workflow in Cloudflare locally
        env:
          REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/ericclemmons/effect-ci-testbed.git' }}
          REVISION: ${{ github.head_ref || github.ref_name }}
        run: |
          log="$RUNNER_TEMP/${{ matrix.example }}.log"
          instance_id="effect-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          params=$(node -e 'process.stdout.write(JSON.stringify({ repository: process.env.REPOSITORY, revision: process.env.REVISION }))')

          pnpm --filter ${{ matrix.package }} dev >"$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$log"' EXIT

          ready=
          for attempt in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "wrangler dev exited before becoming ready" >&2
              exit 1
            fi
            if curl --silent --fail --output /dev/null http://localhost:8787; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ -z "$ready" ]; then
            echo "wrangler dev did not become ready before the timeout" >&2
            exit 1
          fi

          timeout 30s pnpm --filter ${{ matrix.package }} exec wrangler workflows trigger \
            ${{ matrix.workflow }} \
            "$params" \
            --id "$instance_id" \
            --local

          for attempt in $(seq 1 180); do
            description=$(timeout 15s pnpm --filter ${{ matrix.package }} exec wrangler workflows instances describe \
              ${{ matrix.workflow }} \
              "$instance_id" \
              --local \
              --json 2>/dev/null || true)
            status=$(DESCRIPTION="$description" node -e '
              try {
                const value = JSON.parse(process.env.DESCRIPTION)
                process.stdout.write(value.status ?? value.instance?.status ?? "")
              } catch {}
            ')

            if [ "$status" = "complete" ]; then
              exit 0
            fi
            if [ "$status" = "errored" ] || [ "$status" = "terminated" ]; then
              echo "$description"
              exit 1
            fi
            sleep 2
          done

          echo "Cloudflare Workflow did not complete before the timeout" >&2
          exit 1

  cloudflare-bundle:
    name: ${{ matrix.example }} / Cloudflare bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: docker-in-docker
            package: effect-ci-docker-in-docker-fixture
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Verify portable plan and Worker bundle
        env:
          EFFECT_CI_EVENT: workflow_dispatch
        run: |
          pnpm cf-ci --workflow examples/${{ matrix.example }}/.cloudflare/ci/workflow.ts plan
          pnpm --filter ${{ matrix.package }} exec wrangler deploy \
            --dry-run \
            --containers-rollout=none

  github-cloudflare-ci:
    name: github-cloudflare-ci / webhook bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Verify production Worker bundle
        run: |
          pnpm --filter @effect-ci-testbed/app exec cf deploy --dry-run
          pnpm --filter @effect-ci-testbed/example-runner exec cf deploy --dry-run
          pnpm --filter effect-ci-cloudflare-hitl-release-fixture exec cf deploy --dry-run
      - name: Verify Cloudflare HITL locally
        env:
          EFFECT_CI_APPROVAL: approved
        run: pnpm cf-ci --workflow examples/cloudflare-hitl-release/.cloudflare/ci/workflow.ts
      - name: Verify signed dispatch and duplicate delivery
        run: node --test examples/github-cloudflare-ci/.cloudflare/ci/tests/webhook.test.ts
      - name: Verify Slack approvals and single-message progress
        run: node --test packages/github/src/*.test.ts packages/github-cloudflare/src/*.test.ts apps/effect-ci/src/workflow.test.ts apps/effect-ci/access.config.test.ts apps/example-runner/src/*.test.ts
      - name: Verify remote CLI authentication and event streaming
        run: node --test packages/cli/src/*test.ts apps/example-runner/src/*test.ts
      - name: Verify source exports and HMD health foundations
        run: node --test packages/cloudflare/src/*.test.ts apps/hmd-demo/src/*.test.ts
      - name: Verify hosted Worker starts locally
        run: |
          log="$RUNNER_TEMP/github-cloudflare-ci.log"

          pnpm --filter @effect-ci-testbed/app exec cf dev >"$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$log"' EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://localhost:5173; then
              ready=true
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              exit 1
            fi

            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "cf dev did not become ready" >&2
            exit 1
          fi

  task-cache:
    name: ${{ matrix.example }} / restored task output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: vite-plus-cache
            package: effect-ci-vite-plus-cache-fixture
            workflow: effect-ci-vite-plus-cache
          - example: turborepo-cache
            package: effect-ci-turborepo-cache-fixture
            workflow: effect-ci-turborepo-cache
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Verify cache miss then hit across Workflow instances
        env:
          REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/ericclemmons/effect-ci-testbed.git' }}
          REVISION: ${{ github.head_ref || github.ref_name }}
        run: |
          log="$RUNNER_TEMP/${{ matrix.example }}.log"
          params=$(node -e 'process.stdout.write(JSON.stringify({ repository: process.env.REPOSITORY, revision: process.env.REVISION }))')

          pnpm --filter ${{ matrix.package }} dev >"$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$log"' EXIT

          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://localhost:8787; then
              break
            fi
            sleep 2
          done

          wait_for_workflow() {
            local instance_id="$1"

            for attempt in $(seq 1 90); do
              description=$(pnpm --filter ${{ matrix.package }} exec wrangler workflows instances describe \
                ${{ matrix.workflow }} \
                "$instance_id" \
                --local \
                --json 2>/dev/null || true)
              run_state=$(DESCRIPTION="$description" node -e '
                try {
                  const value = JSON.parse(process.env.DESCRIPTION)
                  process.stdout.write(value.status ?? "")
                } catch {}
              ')

              if [ "$run_state" = "complete" ]; then
                echo "$description"
                return 0
              fi
              if [ "$run_state" = "errored" ] || [ "$run_state" = "terminated" ]; then
                echo "$description" >&2
                return 1
              fi
              sleep 2
            done

            echo "Workflow $instance_id did not complete before the timeout" >&2
            return 1
          }

          first="task-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-1"
          second="task-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-2"

          pnpm --filter ${{ matrix.package }} exec wrangler workflows trigger \
            ${{ matrix.workflow }} "$params" --id "$first" --local
          wait_for_workflow "$first" >/dev/null

          pnpm --filter ${{ matrix.package }} exec wrangler workflows trigger \
            ${{ matrix.workflow }} "$params" --id "$second" --local
          description=$(wait_for_workflow "$second")

          DESCRIPTION="$description" node scripts/assert-task-cache-hit.ts

  package-manager-cache:
    name: package-manager-cache / offline restore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Populate the download cache through Effect CI
        working-directory: examples/package-manager-cache
        run: node ../../packages/cli/src/bin.ts --workflow .cloudflare/ci/workflow.ts run
      - name: Restore downloads into a fresh workspace without network access
        run: |
          fresh="$RUNNER_TEMP/package-manager-cache-fresh"
          cache="$GITHUB_WORKSPACE/examples/package-manager-cache/app/.effect-ci/cache/npm"
          mkdir -p "$fresh"
          cp examples/package-manager-cache/app/package.json "$fresh/package.json"
          cp examples/package-manager-cache/app/package-lock.json "$fresh/package-lock.json"
          cp examples/package-manager-cache/app/verify.js "$fresh/verify.js"

          cd "$fresh"
          npm_config_cache="$cache" npm ci --offline
          npm run verify
      - name: Verify the Cloudflare adapter bundles
        run: |
          pnpm --filter effect-ci-package-manager-cache-fixture exec wrangler deploy \
            --dry-run \
            --containers-rollout=none
