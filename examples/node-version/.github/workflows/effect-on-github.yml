name: Effect on GitHub

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/effect-ci.yml
    with:
      workflow: .cloudflare/ci/workflow.ts
      cache-path: .effect-ci/cache/mise
      cache-key: node-version
      cache-key-files: .node-version
