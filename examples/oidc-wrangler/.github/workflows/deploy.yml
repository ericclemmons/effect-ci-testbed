name: Deploy with wrangler and Effect CI OIDC
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure Cloudflare credentials
        uses: ./.github/actions/configure-cloudflare-credentials
        with:
          worker: effect-ci-oidc-wrangler
          scopes: workers:edit
      - name: Deploy with wrangler
        working-directory: examples/oidc-wrangler
        run: pnpm exec wrangler deploy
