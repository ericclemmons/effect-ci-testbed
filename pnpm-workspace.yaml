packages:
  - apps/*
  - packages/*
  - examples/*
  - examples/ordered-deploy/apps/*
  - examples/vite-plus-cache/app

allowBuilds:
  "@google/genai": false
  core-js-pure: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261001.1"
  - miniflare@5.20260926.1-alpha || 5.20260930.0-alpha
  - wrangler@4.145.0
  - "@cloudflare/workerd-darwin-64@1.20260930.2"
  - "@cloudflare/workerd-darwin-arm64@1.20260930.2"
  - "@cloudflare/workerd-linux-64@1.20260930.2"
  - "@cloudflare/workerd-linux-arm64@1.20260930.2"
  - "@cloudflare/workerd-windows-64@1.20260930.2"
  - workerd@1.20260930.2
  - effect@4.0.6
