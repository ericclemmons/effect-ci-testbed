name: GitHub Actions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require a credential without printing it
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test -n "$REGISTRY_TOKEN"
