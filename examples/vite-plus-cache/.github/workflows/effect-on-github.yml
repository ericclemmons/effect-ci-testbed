name: Effect CI on GitHub

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/effect-ci.yml
    with:
      workflow: .cloudflare/ci/workflow.ts
      cache-path: app/node_modules/.vite/task-cache
      cache-key: vite-task
      cache-key-files: app/package-lock.json
    secrets: inherit
