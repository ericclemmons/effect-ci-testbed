name: Effect CI on Blacksmith

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/effect-ci.yml
    with:
      workflow: examples/blacksmith/.cloudflare/ci/workflow.ts
      runs-on: '["blacksmith-2vcpu-ubuntu-2404"]'
    secrets: inherit
