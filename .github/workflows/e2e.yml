name: Testbed E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  github:
    name: ${{ matrix.example }} / github
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - node-npm
          - node-pnpm
    steps:
      - uses: actions/checkout@v7

      - name: Install act
        env:
          ACT_VERSION: v0.2.89
          ACT_SHA256: 0191d6f1f3b716b5c55820032605d05fc3c1cdbf581ebeff655019e5dd1524c0
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/nektos/act/releases/download/${ACT_VERSION}/act_Linux_x86_64.tar.gz" \
            --output "$RUNNER_TEMP/act.tar.gz"
          echo "$ACT_SHA256  $RUNNER_TEMP/act.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/act"
          tar -xzf "$RUNNER_TEMP/act.tar.gz" -C "$RUNNER_TEMP/act" act
          echo "$RUNNER_TEMP/act" >> "$GITHUB_PATH"

      - name: Run examples/${{ matrix.example }}/.github/workflows/github.yml
        env:
          EXAMPLE: ${{ matrix.example }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          example_root="$RUNNER_TEMP/examples/$EXAMPLE"
          mkdir -p "$example_root"
          cp -R "examples/$EXAMPLE/." "$example_root"

          git -C "$example_root" init --initial-branch=main
          git -C "$example_root" config user.name effect-ci-testbed
          git -C "$example_root" config user.email effect-ci-testbed@users.noreply.github.com
          git -C "$example_root" add .
          git -C "$example_root" commit -m "Stage $EXAMPLE"

          cd "$example_root"
          act pull_request \
            --bind \
            --concurrent-jobs 1 \
            --platform ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-latest \
            --secret GITHUB_TOKEN \
            --workflows .github/workflows/github.yml

  local:
    name: ${{ matrix.example }} / local / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - node-npm
          - node-pnpm
        mode:
          - plan
          - execute
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Run examples/${{ matrix.example }}/.cloudflare/workflows/ci.run.ts (${{ matrix.mode }})
        env:
          EFFECT_CI_EVENT: pull_request
        run: examples/${{ matrix.example }}/.cloudflare/workflows/ci.run.ts ${{ matrix.mode == 'execute' && 'run' || 'plan' }} --format=text

  agent-cli:
    name: agent-first executable CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Discover exported actions
        run: examples/node-npm/.cloudflare/workflows/ci.run.ts list --format=text
      - name: Plan one action as structured output
        run: |
          output=$(examples/node-npm/.cloudflare/workflows/ci.run.ts plan lint --format=json)
          echo "$output"
          OUTPUT="$output" node -e '
            const value = JSON.parse(process.env.OUTPUT)
            if (!value.ok || value.target !== "lint") process.exit(1)
            if (value.plan.nodes.at(-1)?.id !== "lint") process.exit(1)
          '
      - name: Return a stable remote-provider exit
        run: |
          output="$RUNNER_TEMP/effect-ci-remote.json"
          if examples/node-npm/.cloudflare/workflows/ci.run.ts --remote --format=json >"$output"; then
            echo "Expected unconfigured remote execution to fail" >&2
            exit 1
          else
            status=$?
          fi
          cat "$output"
          test "$status" -eq 3
          grep --fixed-strings '"code": "CI_REMOTE_UNAVAILABLE"' "$output"

  effect-on-github:
    name: ${{ matrix.example }} / effect-on-github
    strategy:
      fail-fast: false
      matrix:
        example:
          - node-npm
          - node-pnpm
    uses: ./.github/workflows/effect-ci.yml
    with:
      workflow: examples/${{ matrix.example }}/.cloudflare/workflows/pull-request.ts
    secrets: inherit

  hitl-deploy:
    name: hitl-deploy / local / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - plan
          - approved
          - rejected
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Verify ${{ matrix.mode }} deployment decision
        env:
          DRY_RUN: ${{ matrix.mode == 'plan' && '1' || '' }}
          EFFECT_CI_APPROVAL: ${{ matrix.mode == 'rejected' && 'rejected' || 'approved' }}
          EFFECT_CI_EVENT: workflow_dispatch
          EFFECT_CI_WORKFLOW: examples/hitl-deploy/.cloudflare/workflows/deploy.ts
        run: |
          output="$RUNNER_TEMP/hitl-deploy-${{ matrix.mode }}.log"

          if [ "${{ matrix.mode }}" = "rejected" ]; then
            if pnpm exec tsx packages/ci/run.run.ts >"$output" 2>&1; then
              cat "$output"
              echo "Expected the rejected approval to fail" >&2
              exit 1
            fi

            cat "$output"
            grep --fixed-strings "ApprovalError" "$output"

            if grep --fixed-strings '$ echo npx cf deploy' "$output"; then
              echo "Deploy command ran after rejection" >&2
              exit 1
            fi
          else
            pnpm exec tsx packages/ci/run.run.ts
          fi

  cloudflare-runner:
    name: cloudflare-runner / Cloudflare local runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Verify portable plan and Worker bundle
        run: |
          pnpm ci:cloudflare-runner:dry-run
          pnpm --filter effect-ci-cloudflare-runner-fixture exec wrangler deploy \
            --dry-run \
            --containers-rollout=none
      - name: Execute checkout, install, and build in Cloudflare locally
        env:
          REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/ericclemmons/effect-ci-testbed.git' }}
          REVISION: ${{ github.head_ref || github.ref_name }}
        run: |
          log="$RUNNER_TEMP/cloudflare-runner.log"
          instance_id="effect-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          params=$(node -e 'process.stdout.write(JSON.stringify({ repository: process.env.REPOSITORY, revision: process.env.REVISION }))')

          pnpm --filter effect-ci-cloudflare-runner-fixture dev >"$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$log"' EXIT

          ready=
          for attempt in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "wrangler dev exited before becoming ready" >&2
              exit 1
            fi
            if curl --silent --fail --output /dev/null http://localhost:8787; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ -z "$ready" ]; then
            echo "wrangler dev did not become ready before the timeout" >&2
            exit 1
          fi

          timeout 30s pnpm --filter effect-ci-cloudflare-runner-fixture exec wrangler workflows trigger \
            effect-ci-cloudflare-runner \
            "$params" \
            --id "$instance_id" \
            --local

          for attempt in $(seq 1 90); do
            description=$(timeout 15s pnpm --filter effect-ci-cloudflare-runner-fixture exec wrangler workflows instances describe \
              effect-ci-cloudflare-runner \
              "$instance_id" \
              --local \
              --json 2>/dev/null || true)
            status=$(DESCRIPTION="$description" node -e '
              try {
                const value = JSON.parse(process.env.DESCRIPTION)
                process.stdout.write(value.status ?? value.instance?.status ?? "")
              } catch {}
            ')

            if [ "$status" = "complete" ]; then
              exit 0
            fi
            if [ "$status" = "errored" ] || [ "$status" = "terminated" ]; then
              echo "$description"
              exit 1
            fi
            sleep 2
          done

          echo "Cloudflare Workflow did not complete before the timeout" >&2
          exit 1
