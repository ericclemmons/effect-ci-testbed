name: Pull request
description: Install, lint, test, and build the Node/npm example

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false

    - run: npm ci
      shell: bash
      working-directory: ${{ github.action_path }}/../../../app

    - run: npm run lint
      shell: bash
      working-directory: ${{ github.action_path }}/../../../app

    - run: npm test
      shell: bash
      working-directory: ${{ github.action_path }}/../../../app

    - run: npm run build
      shell: bash
      working-directory: ${{ github.action_path }}/../../../app
