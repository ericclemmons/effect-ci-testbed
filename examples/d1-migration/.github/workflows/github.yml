name: GitHub Actions

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/build.mjs
      - id: migrate
        continue-on-error: true
        run: node scripts/migrate.mjs
      - id: deploy
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        run: node scripts/deploy.mjs
      - id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-deployment.mjs
      - name: Roll back deployment
        if: steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: node scripts/rollback.mjs
      - name: Roll back migration
        if: steps.migrate.outcome == 'failure' || steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: node scripts/rollback-migration.mjs
      - name: Preserve the original failure
        if: steps.migrate.outcome == 'failure' || steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: exit 1
